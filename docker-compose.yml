# Project name keeps these containers and volumes separate from other local projects.
name: auth-slice

services:
  db:
    image: postgres:18-alpine
    environment:
      # Local development credentials only. Never reuse outside this machine.
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports:
      # 5433 on the host because another project's Postgres already uses 5432.
      - "5433:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker, so mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    name: auth-slice-pgdata
